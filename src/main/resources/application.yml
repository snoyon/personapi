spring:
  datasource:
    url: jdbc:h2:mem:personnes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: 8080

personnes-api:
  security:
    clients:
      - cn: api-manager
        client-id: client-mobile
        familles-autorisees:
          - "1"
          - "2"
          - "3"
      - cn: api-manager
        client-id: client-partenaire-identite
        familles-autorisees:
          - "1"
      - cn: api-manager
        client-id: client-rh
        familles-autorisees:
          - "1"
          - "3"
      - cn: application-directe-rh
        familles-autorisees:
          - "1"
          - "3"
