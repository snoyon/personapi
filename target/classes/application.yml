spring:
  datasource:
    url: jdbc:h2:mem:personnes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: 8080

personnes-api:
  security:
    clients:
      client-mobile:
        familles-autorisees:
          - "1"
          - "2"
          - "3"
      client-partenaire-identite:
        familles-autorisees:
          - "1"
      client-rh:
        familles-autorisees:
          - "1"
          - "3"
